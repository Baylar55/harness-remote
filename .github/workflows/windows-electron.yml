name: Build Windows Electron app

"on":
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'web/src/**'
      - 'web/electron/**'
      - 'web/public/**'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/tsconfig*.json'
      - 'web/vite.config.ts'
      - '.github/workflows/windows-electron.yml'
      - 'bridge/**'

permissions:
  contents: read

env:
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build PWA renderer
        run: npm run build
        working-directory: web

      - name: Run web regression tests
        run: |
          npm run test:i18n
          npm run test:config
          npm run test:ui
          npm run test:settings
          npm run test:platform
          npm run test:model
          npm run test:events
          npm run test:profiles
          npm run test:desktop
        working-directory: web

      - name: Run bridge tests
        run: npm test
        working-directory: bridge
      - name: Build unsigned Windows installer
        run: npm run package:win
        working-directory: web

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: harness-remote-windows-unsigned-${{ github.sha }}
          path: web/release/Harness-Remote-*-win-x64-unsigned.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: harness-remote-windows-unsigned-${{ github.sha }}
          path: release

      - name: Wait for Android-owned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(10)
          do {
            gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          throw "GitHub release ${{ github.ref_name }} did not appear within 10 minutes; Android workflow must publish it first."

      - name: Attach Windows installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter 'Harness-Remote-*-win-x64-unsigned.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          gh release upload "${{ github.ref_name }}" $installers[0].FullName --clobber
