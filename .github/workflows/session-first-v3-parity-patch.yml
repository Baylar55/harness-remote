name: Session-first v3 parity patch

on:
  push:
    branches: [feature/v3-session-first-read-path]
    paths: [.github/workflows/session-first-v3-parity-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/v3-session-first-read-path
          fetch-depth: 0
      - name: Apply exact v3 parity patches
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "web/src/components/standalone-universal-workspace.tsx",
              '''      <ConversationWorkspace
        machines={machines}
        activeMachineID={activeID}
        onActiveMachineID={setActiveMachineID}
        onManageMachines={showMachines}
      />
      {primarySection === "sessions" ? <NativeSessionsWorkspace machines={machines} onBackToConversations={showConversations} onManageMachines={showMachines} /> : null}''',
              '''      {primarySection === "conversations" ? (
        <ConversationWorkspace
          machines={machines}
          activeMachineID={activeID}
          onActiveMachineID={setActiveMachineID}
          onManageMachines={showMachines}
        />
      ) : (
        <NativeSessionsWorkspace machines={machines} onBackToConversations={showConversations} onManageMachines={showMachines} />
      )}'''
          )

          replace(
              "web/src/components/work-thread-conversation.tsx",
              'const WorkThreadBubble = memo(function WorkThreadBubble',
              'export const WorkThreadBubble = memo(function WorkThreadBubble'
          )

          observer = Path("web/src/components/native-session-observer.tsx")
          text = observer.read_text()
          text = text.replace(
              'import { TaskDeskConversation } from "./taskdesk-conversation"',
              'import { TaskDeskConversation } from "./taskdesk-conversation"\nimport { WorkThreadBubble } from "./work-thread-conversation"\nimport type { WorkThreadMessage } from "../work-thread-timeline"',
              1
          )
          text = text.replace(
              '  const working = nativeSessionIsWorking(statusType)\n  const writable = writeState === "ready"\n  const attention = useMemo(() => latestConversationAttention(feed?.messages || [], { active: working }), [feed?.messages, working])',
              '  const working = nativeSessionIsWorking(statusType)\n  const writable = writeState === "ready"\n  const currentSessionMessages = useMemo(() => (feed?.messages || []).filter((message) => message.info.sessionID === target.sessionID), [feed?.messages, target.sessionID])\n  const attention = useMemo(() => latestConversationAttention(currentSessionMessages, { active: working }), [currentSessionMessages, working])',
              1
          )
          text = text.replace(
              '    const messages = feed?.messages || []',
              '    const messages = currentSessionMessages',
              1
          )
          text = text.replace(
              '  }, [feed?.messages, target.sessionID])',
              '  }, [currentSessionMessages, target.sessionID])',
              1
          )
          text = text.replace(
              '          directory={target.directory}\n          footerHint={writable ? "Continue the same native Session." : "Observe only until the harness confirms this Session can be resumed safely."}',
              '          directory={target.directory}\n          footerHint={writable ? "Continue the same native Session." : "Observe only until the harness confirms this Session can be resumed safely."}\n          renderMessage={(message) => <WorkThreadBubble key={message.info.id} message={message as WorkThreadMessage} />}',
              1
          )
          observer.write_text(text)

          Path(".github/workflows/session-first-v3-parity-patch.yml").unlink()

      - name: Commit parity patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/standalone-universal-workspace.tsx web/src/components/work-thread-conversation.tsx web/src/components/native-session-observer.tsx .github/workflows/session-first-v3-parity-patch.yml
          git commit -m "fix: reuse v3 workspace and message surface"
          git push origin HEAD:feature/v3-session-first-read-path
