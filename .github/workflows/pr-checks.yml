name: PR checks

"on":
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: write

jobs:
  patch:
    name: Apply exact v3 parity patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/v3-session-first-read-path
          fetch-depth: 200

      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "web/src/components/standalone-universal-workspace.tsx",
              '''      <ConversationWorkspace
        machines={machines}
        activeMachineID={activeID}
        onActiveMachineID={setActiveMachineID}
        onManageMachines={showMachines}
      />
      {primarySection === "sessions" ? <NativeSessionsWorkspace machines={machines} onBackToConversations={showConversations} onManageMachines={showMachines} /> : null}''',
              '''      {primarySection === "conversations" ? (
        <ConversationWorkspace
          machines={machines}
          activeMachineID={activeID}
          onActiveMachineID={setActiveMachineID}
          onManageMachines={showMachines}
        />
      ) : (
        <NativeSessionsWorkspace machines={machines} onBackToConversations={showConversations} onManageMachines={showMachines} />
      )}'''
          )

          replace(
              "web/src/components/work-thread-conversation.tsx",
              'const WorkThreadBubble = memo(function WorkThreadBubble',
              'export const WorkThreadBubble = memo(function WorkThreadBubble'
          )

          p = Path("web/src/components/native-session-observer.tsx")
          text = p.read_text()
          text = text.replace(
              'import { TaskDeskConversation } from "./taskdesk-conversation"',
              'import { TaskDeskConversation } from "./taskdesk-conversation"\nimport { WorkThreadBubble } from "./work-thread-conversation"\nimport type { WorkThreadMessage } from "../work-thread-timeline"',
              1
          )
          text = text.replace(
              '  const working = nativeSessionIsWorking(statusType)\n  const writable = writeState === "ready"\n  const attention = useMemo(() => latestConversationAttention(feed?.messages || [], { active: working }), [feed?.messages, working])',
              '  const working = nativeSessionIsWorking(statusType)\n  const writable = writeState === "ready"\n  const currentSessionMessages = useMemo(() => (feed?.messages || []).filter((message) => message.info.sessionID === target.sessionID), [feed?.messages, target.sessionID])\n  const displayMessages = useMemo(() => (feed?.messages || []).map((message) => {\n    const existing = message as WorkThreadMessage\n    if (existing.taskdesk) return existing\n    return { ...message, taskdesk: { kind: "native", agentId: target.agentID, agentLabel: target.agentLabel, agentBackend: target.backend } } as WorkThreadMessage\n  }), [feed?.messages, target.agentID, target.agentLabel, target.backend])\n  const attention = useMemo(() => latestConversationAttention(currentSessionMessages, { active: working }), [currentSessionMessages, working])',
              1
          )
          text = text.replace('    const messages = feed?.messages || []', '    const messages = currentSessionMessages', 1)
          text = text.replace('  }, [feed?.messages, target.sessionID])', '  }, [currentSessionMessages, target.sessionID])', 1)
          old_claim = '''    if (result.writable) {
      if (target.transport === "acp") {
        try {
          // Claiming an external ACP Session changes transcript authority. Replace the current
          // journal-backed page once with the claimed ACP replay/cache instead of merging IDs from
          // two sources. From this point all tail/older refreshes stay on the owned authority.
          const next = await loadNativeSessionFeed(target, undefined, 200, true)
          feedRef.current = next
          setFeed(next)
        } catch (reason) {
          setWriteState("observe")
          setResumeError(`The Session was claimed but its transcript could not be reconciled safely: ${reason instanceof Error ? reason.message : String(reason)}`)
          return
        }
      }
      setWriteState("ready")
      void refreshStatus()
      return
    }'''
          new_claim = '''    if (result.writable) {
      // Mature v3 keeps the same transcript authority across writer acquisition. Claiming changes
      // write ownership only; replacing the visible feed here caused jumps and duplicate PI/Codex
      // replay envelopes in the Session-first draft.
      setWriteState("ready")
      void refreshStatus()
      return
    }'''
          if old_claim not in text:
              raise SystemExit("claim replacement block not found")
          text = text.replace(old_claim, new_claim, 1)
          text = text.replace('          messages={feed?.messages || []}', '          messages={displayMessages}', 1)
          text = text.replace(
              '          footerHint={writable ? "Continue the same native Session." : "Observe only until the harness confirms this Session can be resumed safely."}',
              '          footerHint={writable ? "Continue the same native Session." : "Observe only until the harness confirms this Session can be resumed safely."}\n          renderMessage={(message) => <WorkThreadBubble key={message.info.id} message={message as WorkThreadMessage} />}',
              1
          )
          p.write_text(text)

          p = Path("web/scripts/native-session-browser-smoke.mjs")
          text = p.read_text()
          text = text.replace('const PROMPT_TEXT = "MODEL-EFFORT-PROMPT"', 'const PROMPT_TEXT = "MODEL-EFFORT-PROMPT"\nconst HANDOFF_PROMPT_TEXT = "HANDOFF-CONTEXT-PROMPT"', 1)
          text = text.replace('const handoffBodies = []', 'const handoffBodies = []\nconst handoffPromptBodies = []\nlet handoffMessages = []', 1)
          text = text.replace(
              '''    if (request.method === "GET" && url.pathname === `/v1/agents/opencode/session/${HANDOFF_SESSION_ID}/message`) {
      json(response, 200, [], { "X-Has-More": "0" })
      return
    }''',
              '''    if (request.method === "GET" && url.pathname === `/v1/agents/opencode/session/${HANDOFF_SESSION_ID}/message`) {
      json(response, 200, handoffMessages, { "X-Has-More": "0" })
      return
    }'''
          )
          marker = '    if (request.method === "POST" && url.pathname === `/v1/agents/codex/session/${SESSION_ID}/handoff`) {'
          target_route = '''    if (request.method === "POST" && url.pathname === `/v1/agents/opencode/session/${HANDOFF_SESSION_ID}/prompt`) {
      const body = await requestJSON(request)
      handoffPromptBodies.push(body)
      handoffMessages = [
        { info: { id: "handoff-user-1", role: "user", sessionID: HANDOFF_SESSION_ID, time: { created: 9000 } }, parts: [{ id: "handoff-user-text", type: "text", text: body.text }] },
        { info: { id: "handoff-assistant-1", role: "assistant", sessionID: HANDOFF_SESSION_ID, time: { created: 9001 } }, parts: [{ id: "handoff-assistant-text", type: "text", text: "HANDOFF-ASSISTANT-REPLY" }] }
      ]
      json(response, 200, { status: "accepted" })
      return
    }

'''
          if marker not in text:
              raise SystemExit("handoff route marker not found")
          text = text.replace(marker, target_route + marker, 1)
          text = text.replace('  const handoffsBefore = handoffBodies.length', '  const handoffsBefore = handoffBodies.length\n  const handoffPromptsBefore = handoffPromptBodies.length', 1)
          old_end = '''  const targetComposer = page.getByRole("textbox", { name: "Message OpenCode" })
  await targetComposer.waitFor({ state: "visible" })
  assert.equal(claimCount, claimsBefore + 1, "opening the HTTP target Session must not claim the source or target ACP writer")

  await context.close()'''
          new_end = '''  const targetComposer = page.getByRole("textbox", { name: "Message OpenCode" })
  await targetComposer.waitFor({ state: "visible" })
  assert.equal(claimCount, claimsBefore + 1, "opening the HTTP target Session must not claim the source or target ACP writer")
  assert.equal(await page.getByRole("button", { name: "Continue this Session" }).count(), 0, "handoff target must not require a second Continue this Session claim")
  assert.equal(await page.getByText("ASSISTANT-FIRST-MARKER", { exact: true }).count(), 1, "handoff target must retain source history exactly once")
  assert.equal(await page.getByText("ASSISTANT-LAST-MARKER", { exact: true }).count(), 1, "handoff target lost the latest source response")

  await targetComposer.fill(HANDOFF_PROMPT_TEXT)
  await page.getByRole("button", { name: "Send" }).click()
  const deadline = Date.now() + 5000
  while (handoffPromptBodies.length < handoffPromptsBefore + 1 && Date.now() < deadline) await new Promise((resolve) => setTimeout(resolve, 50))
  assert.equal(handoffPromptBodies.length, handoffPromptsBefore + 1, "first target Send must create exactly one native prompt")
  const targetPrompt = handoffPromptBodies[handoffPromptsBefore]
  assert.ok(targetPrompt.text.startsWith("You are taking over an existing TaskDesk task."), "first target prompt must carry the mature v3 handoff packet")
  assert.ok(targetPrompt.text.includes("ASSISTANT-LAST-MARKER"), "handoff packet must contain bounded source context")
  assert.ok(targetPrompt.text.includes(`USER INSTRUCTION\\n${HANDOFF_PROMPT_TEXT}`), "handoff packet must preserve the visible user instruction")
  await page.getByText(HANDOFF_PROMPT_TEXT, { exact: true }).waitFor({ state: "visible" })
  await page.getByText("HANDOFF-ASSISTANT-REPLY", { exact: true }).waitFor({ state: "visible" })
  assert.equal(await page.getByText("You are taking over an existing TaskDesk task.", { exact: false }).count(), 0, "technical handoff packet leaked into visible chat")
  assert.equal(await page.getByText(HANDOFF_PROMPT_TEXT, { exact: true }).count(), 1, "target user instruction duplicated in chat")
  assert.equal(await page.getByText("HANDOFF-ASSISTANT-REPLY", { exact: true }).count(), 1, "target assistant reply duplicated in chat")

  await context.close()'''
          if old_end not in text:
              raise SystemExit("browser assertion block not found")
          p.write_text(text.replace(old_end, new_end, 1))

          # Return the normal workflow from the last clean workflow commit and remove the trigger.
          normal = subprocess.check_output(["git", "show", "b032edc9fbba7a608aefefe2da1747e9793b81f3:.github/workflows/pr-checks.yml"], text=True)
          Path(".github/workflows/pr-checks.yml").write_text(normal)
          trigger = Path("web/.session-first-parity-trigger")
          if trigger.exists(): trigger.unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore v3 chat parity for Session handoff"
          git push origin HEAD:feature/v3-session-first-read-path
