name: Deploy web app to GitHub Pages

# Tags only, to match how the APK is published: built on every push, released only on a `v*` tag.
# Deploying from main would make the public app track the tip of the branch while the public APK
# tracks releases — two channels telling users two different stories, and every merge live with no
# step in between. `workflow_dispatch` stays for a manual redeploy.
"on":
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Type-check
        run: npx tsc -b
        working-directory: web

      # This job now publishes to users, so it gates on the same suites as the APK release rather
      # than on the type-check alone.
      - name: Run web regression tests
        run: |
          npm run test:i18n
          npm run test:config
          npm run test:ui
          npm run test:settings
          npm run test:model
          npm run test:events
        working-directory: web

      - name: Build web app
        # GitHub Pages serves project sites from /<repo>/, so the app's asset and PWA URLs need
        # that prefix baked in at build time.
        run: npx vite build --base="/${{ github.event.repository.name }}/"
        working-directory: web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
